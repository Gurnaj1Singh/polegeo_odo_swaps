# Splat-LOAM (Giacomini et al., ICCV 2025) on SnowPole: the repository's KITTI car odometry config
# (configs/kitti/kitti-00-odom.yaml -> kitti.yaml). Changes, none of them tuning:
#   - preprocessing.image_height 128: spherical projection sized to the Ouster OS2-128 (KITTI: 64 rows)
#   - no ground-truth trajectory file (initial pose = identity, like every method)
#   - rerun visual logging off (headless); TUM writer
# Input: /seq = KITTI layout: velodyne/ (cache/kitti_bins, shared 2-150 m scans), times.txt
# (cache/splatloam_times.txt) and calib.txt (identity; the KITTI reader always opens it, used only for GT alignment).
inherit_from: configs/kitti/kitti.yaml
data:
  dataset_type: kitti
  cloud_reader:
    cloud_folder: /seq
  trajectory_reader:
    filename: null
  skip_clouds_wno_sync: False
preprocessing:
  image_height: 128
  image_width: 1024
output:
  folder: /work/outputs/splatloam
  writer: tum
logging:
  enable: false
mapping:
  num_iterations: 200
  densify_threshold_egeom: -1
  densify_threshold_opacity: 0.2
  densify_percentage: 0.3
  prob_view_last_keyframe: null
  pruning_min_opacity: 0.1
  pruning_min_size: 0.0
  pruning_max_size: 1.0
  opt_lambda_alpha: 0.4
  opt_lambda_normal: 0.5
  opt_scaling_max: 0.1
  opt_scaling_max_penalty: 1.0
  lmodel_threshold_ngaussians: null
  lmodel_threshold_nkeyframes: null
tracking:
  method: gsaligner
  keyframe_threshold_distance: 5.0
  keyframe_threshold_fitness: 0.30
  keyframe_threshold_nframes: -1
